<!-- campeão: a frase da própria marca acende linha a linha, ao lado do Reel do Armageddon. -->
<section class="historia" id="campeao" aria-label="Performance de campeão">
  <div class="historia__frase" data-revela-grupo data-acende>
    <p class="historia__rotulo linha"><span data-revela>Performance de campeão</span></p>
    <h2 class="linhas">
      <span class="linha"><span data-revela>O energético</span></span>
      <span class="linha"><span data-revela>do tetracampeão</span></span>
      <span class="linha"><span data-revela>do Armageddon.</span></span>
    </h2>
  </div>
  <figure class="historia__video">
    <video data-video data-src="video/armageddon.mp4" poster="/img/armageddon.webp" muted loop playsinline preload="none" width="540" height="960" aria-label="Reel da Hudema com a lata e o carro de corrida"></video>
  </figure>
</section>
<div class="xadrez" aria-hidden="true"></div>
